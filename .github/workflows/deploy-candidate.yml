# Every merge to main becomes a 0%-traffic CANDIDATE revision of Cloud Run
# `merchants-portal`; production traffic does not move. Promotion is a separate,
# manual step (promote.yml) taken after browser acceptance — the release discipline
# this repo already uses (#221: "browser acceptance ... before promotion").
#
# The candidate carries the Cloud Run tag `candidate`, which the load balancer serves
# at https://merchant-candidate.pivota.cc (serverless NEG pinned to that tag). Tag URLs
# on run.app are unreachable: the service's ingress is internal-and-cloud-load-balancing.
#
# Before this, each release was a hand-run build + deploy, and the Vercel project that
# built every merge (serving nothing) was disconnected from Git on 2026-09-26.
#
# Identity: WIF provider `github-frontends` (refs/heads/main only) ->
# sa-merchants-portal-deploy (one Artifact Registry repo, this one service).
name: Deploy candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on main to stage as the candidate (full or short sha). Empty = tip of main.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# Shared with promote.yml: a promote must never interleave with a candidate roll.
concurrency:
  group: deploy-merchants-portal
  cancel-in-progress: false

env:
  PROJECT: pivota-prod
  REGION: us-west1
  SERVICE: merchants-portal
  REPO: us-west1-docker.pkg.dev/pivota-prod/cloud-run-source-deploy/merchants-portal

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Full checkout, then move to the target: a short sha as the checkout `ref` fails.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve the commit (must be on main)
        env:
          WANT: ${{ inputs.sha || github.sha }}
        run: |
          sha=$(git rev-parse --verify --quiet "${WANT}^{commit}") \
            || { echo "::error::${WANT} is not a commit in this repository"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::${sha} is not on main"; exit 1; }
          git checkout --quiet --detach "$sha"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/371394967380/locations/global/workloadIdentityPools/github-actions/providers/github-frontends
          service_account: sa-merchants-portal-deploy@pivota-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Images are tagged with the FULL sha, as the hand-run releases always were.
      - name: Build and push (the cloudbuild.yaml recipe)
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          if gcloud artifacts docker images describe "${REPO}:${SHA}" >/dev/null 2>&1; then
            echo "${REPO}:${SHA} already exists; reusing it"; exit 0
          fi
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          mapfile -t args < <(infra/gcp/docker-build-args.sh "$SHA")
          docker "${args[@]}"
          docker push "${REPO}:${SHA}"

      - name: Deploy as a 0% candidate
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          before=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format=json | jq -c '[.status.traffic[] | select((.percent // 0) > 0) | {revisionName, percent}]')
          echo "serving before: ${before}"
          echo "before=${before}" >> "$GITHUB_ENV"
          # --no-traffic pins current traffic; --tag moves `candidate` to the new revision.
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "${REPO}:${SHA}" --no-traffic --tag candidate --quiet

      - name: Verify the candidate, and that production traffic did not move
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          svc=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)
          after=$(jq -c '[.status.traffic[] | select((.percent // 0) > 0) | {revisionName, percent}]' <<<"$svc")
          [ "$after" = "$before" ] || { echo "::error::production traffic changed: ${before} -> ${after}"; exit 1; }
          cand=$(jq -r '.status.traffic[] | select(.tag == "candidate") | .revisionName' <<<"$svc")
          [ -n "$cand" ] || { echo "::error::no revision carries the candidate tag"; exit 1; }
          # Revisions record the image by DIGEST; resolve the tag to compare.
          want="${REPO}@$(gcloud artifacts docker images describe "${REPO}:${SHA}" --format='value(image_summary.digest)')"
          image=$(gcloud run revisions describe "$cand" --project "$PROJECT" --region "$REGION" \
            --format='value(spec.containers[0].image)')
          [ "$image" = "$want" ] || { echo "::error::candidate ${cand} runs ${image}, want ${want}"; exit 1; }
          code=""
          for i in 1 2 3 4 5 6; do
            # `|| code=000`: under bash -e a curl CONNECTION failure (exit 6 while the host has no
            # DNS yet, or a dropped connection) aborted the step instead of retrying / warning.
            code=$(curl -s -o /dev/null -w '%{http_code}' https://merchant-candidate.pivota.cc/) || code=000
            [ "$code" = 200 ] && break; sleep 10
          done
          echo "https://merchant-candidate.pivota.cc/ -> ${code}"
          [ "$code" = 200 ] || echo "::warning::candidate host not answering 200 (is the merchant-candidate LB route set up?)"
          {
            echo "### Candidate staged: \`${SHA:0:7}\` (${cand}), 0% traffic"
            echo "Accept at https://merchant-candidate.pivota.cc/ then run **Promote** with sha \`${SHA:0:7}\`."
            echo "Production still serves: \`${after}\`"
          } >> "$GITHUB_STEP_SUMMARY"
